[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpgfs"
version = "0.1.0"
description = "Mount a gpg-encrypted directory as a transparently readable and writable virtual drive"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gpgfs = "gpgfs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gpgfs*"]
