[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpgfs"
version = "0.1.0"
description = "Mount a gpg-encrypted directory as a transparently readable and writable virtual drive"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "doitian", email = "35768+doitian@users.noreply.github.com" }]
keywords = ["gpg", "gnupg", "encryption", "webdav", "mount", "vault", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Filesystems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/doitian/gpgfs"
Repository = "https://github.com/doitian/gpgfs"
Issues = "https://github.com/doitian/gpgfs/issues"

[project.scripts]
gpgfs = "gpgfs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[tool.setuptools.packages.find]
include = ["gpgfs*"]
