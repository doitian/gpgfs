name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: ./.github/actions/setup-gpg

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              sys.exit(f"tag {tag!r} must look like v1.2.3")
          version = tag[1:]

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = pyproject["project"]["version"]
          init = pathlib.Path("gpgfs/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE)
          if match is None:
              sys.exit("could not read __version__ from gpgfs/__init__.py")
          module = match.group(1)

          problems = [
              f"pyproject.toml says {declared}" if declared != version else "",
              f"gpgfs/__init__.py says {module}" if module != version else "",
          ]
          problems = [p for p in problems if p]
          if problems:
              sys.exit(f"tag v{version} does not match: " + ", ".join(problems))
          print(f"tag v{version} matches pyproject.toml and gpgfs.__version__")
          PY

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end protocol test
        run: python scripts/protocol_test.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment configured on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/gpgfs
    permissions:
      id-token: write # OIDC token used by PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
