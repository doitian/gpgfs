name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: ./.github/actions/setup-gpg

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end protocol test
        run: python scripts/protocol_test.py

  e2e:
    name: e2e (drive, windows-latest)
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: ./.github/actions/setup-gpg

      # A hosted Windows runner is a Server image where the WebDAV-Redirector feature
      # needs a reboot before the WebClient service exists, and a job cannot reboot.
      # Client Windows images and self-hosted runners already have the service, so this
      # job tests the drive for real there and skips with a warning elsewhere.
      - name: Check the WebDAV redirector
        id: redirector
        shell: pwsh
        run: |
          $service = Get-Service WebClient -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Host "::warning title=Drive test skipped::This runner has no WebClient service; installing WebDAV-Redirector requires a reboot."
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Set-Service WebClient -StartupType Manual
          Start-Service WebClient
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Service WebClient | Format-Table Name, Status, StartType

      - name: Environment check
        if: steps.redirector.outputs.available == 'true'
        shell: pwsh
        run: |
          # "net use" exits non-zero when no mapping exists, so it must not be the
          # last command in the step: Actions uses the final exit code.
          net use
          python -m gpgfs doctor

      - name: End-to-end drive test
        if: steps.redirector.outputs.available == 'true'
        shell: pwsh
        env:
          GPGFS_CI_PASSPHRASE: ci-test-passphrase
        run: |
          New-Item -ItemType Directory -Force -Path C:\vault | Out-Null
          python scripts\e2e_test.py --vault C:\vault --passphrase $env:GPGFS_CI_PASSPHRASE --big-mb 2 --verbose

      - name: Collect diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          net use
          sc.exe query webclient
          if (Test-Path C:\vault) {
            Get-ChildItem C:\vault -Force -Recurse | Select-Object FullName, Length
          }
          exit 0
